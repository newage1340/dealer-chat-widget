# Render blueprint for the TypeScript front desk. Not active until you create the blueprint in Render.
# Pick the web service plan you already pay for; the database's smallest plan costs a few dollars a month.
services:
  - type: web
    name: frontdesk
    runtime: node
    rootDir: frontdesk
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false
    startCommand: node src/main.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "26"
      - key: DATABASE_URL
        fromDatabase:
          name: frontdesk-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: UPLOAD_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: TWILIO_DEFAULT_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false

databases:
  - name: frontdesk-db
    plan: basic-256mb
