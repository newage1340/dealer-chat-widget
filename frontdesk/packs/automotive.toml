# Used-car dealership domain pack.
# Extracted from the original monolithic app.py prompts (build_prompt, _VOICE_RULES_APPEND,
# _VOICE_RULES_INTELLIGENCE); everything here is specific to selling cars.

[domain]
id                       = "automotive"
name                     = "Car Dealership"
description              = "Independent and buy-here-pay-here used car dealerships."
business_noun            = "dealership"
staff_noun               = "sales team"
agent_role               = "sales consultant"
voice_agent_role         = "receptionist"
default_agent_name       = "Dave"
default_voice_agent_name = "Sarah"
goal                     = "Help the customer find the right vehicle and schedule an in-person visit. The goal is a confirmed appointment."
upsell_topics            = "extended warranties, service contracts, GAP coverage, financing, trade-ins, detailing/tinting/ceramic coating, or other add-on services"

[[profile]]
key      = "financing"
label    = "Financing"
question = "Do you offer financing?"

[[profile]]
key      = "trade_ins"
label    = "Trade-ins"
question = "Do you accept trade-ins? (feel free to be as detailed as you like)"

[[profile]]
key      = "policies"
label    = "Notes/Policies"
question = "Any dealership policies the AI should know? (ex: \"no deposits\" or \"prices are firm\")"

[catalog]
item_noun        = "vehicle"
item_noun_plural = "vehicles"
spoken_noun      = "car"
heading          = "INVENTORY"
intro            = "Every vehicle listed below is currently available for sale. This list is the ENTIRE lot - there is nothing else in stock. Never answer with a vague \"a nice selection\" - a customer asking for a number wants a number."
empty_text       = "(No inventory listed yet.)"
title_template   = "{year} {make} {model} {trim}"
id_field         = "stock"
summary_parts    = ["{color}", "{mileage} mi", "{price}"]
summary_suffix   = "[stock# {stock}]"
url_field        = "detail_url"
price_field      = "price"

[[catalog.fields]]
name       = "year"
label      = "Year"
searchable = true

[[catalog.fields]]
name       = "make"
label      = "Make"
searchable = true

[[catalog.fields]]
name       = "model"
label      = "Model"
searchable = true

[[catalog.fields]]
name       = "trim"
label      = "Trim"
searchable = true

[[catalog.fields]]
name       = "color"
label      = "Color"
searchable = true

[[catalog.fields]]
name       = "price"
label      = "Price"
type       = "money"
empty_text = "Call for price"

[[catalog.fields]]
name  = "mileage"
label = "Mileage"
type  = "integer"

[[catalog.fields]]
name  = "stock"
label = "Stock"

[[catalog.fields]]
name  = "vin"
label = "VIN"

[[catalog.fields]]
name       = "description"
label      = "Details"
searchable = true

[[catalog.fields]]
name  = "carfax_url"
label = "CarFax report"

[[catalog.fields]]
name       = "detail_url"
label      = "Listing"
in_details = false

[catalog.aliases]
carfaxurl = "carfax_url"
carfax    = "carfax_url"
detailurl = "detail_url"
url       = "detail_url"
"stock number" = "stock"
"stock #"      = "stock"

[[catalog.sendables]]
field   = "detail_url"
label   = "listing"
trigger = '\b(link|listing|pictures?|photos?|pics?|images?|website)\b'

[[catalog.sendables]]
field   = "carfax_url"
label   = "CARFAX report"
trigger = '\bcar\s*fax\b'

[booking]
visit_noun       = "visit"
subject_label    = "Vehicle"
subject_hint     = "year make model"
general_subject  = "general visit"
location         = "business"
skip_intake_when = "the booking is a SERVICE appointment on the customer's OWN car (oil change, brakes, engine, transmission, body work) or a general visit with no specific vehicle - those go straight to the next step"

[[booking.intake]]
key      = "questions"
label    = "Other questions"
ask      = "Ask whether they have any other questions about the vehicle; answer them from the inventory data."
channels = ["chat"]

[[booking.intake]]
key = "trade_in"
label = "Trade-in"
ask = "Ask casually whether they have a trade-in. If they say yes but haven't named it, ask what vehicle it is (year/make/model). On a phone call also get its mileage and condition - both are required if they have a trade, but never re-ask for anything they already said. The trade-in is THEIR car: never treat it as inventory or as the vehicle they're coming to see."

[[booking.intake]]
key = "financing"
label = "Financing"
ask = "Ask whether they're paying cash or interested in financing. If financing, briefly confirm what the dealership offers (per Business Info) and that the team will go over options at the visit. Never collect credit details."

