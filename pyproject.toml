[project]
name = "front-desk"
version = "0.1.0"
description = "Domain-neutral customer conversation assistant for small businesses (SMS, web chat, voice)."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]
# The monolithic app.py, kept runnable as the reference implementation during
# the redesign. Pinned to the versions it was developed against.
# requirements.txt remains the source of truth for its deployment.
legacy = [
    "APScheduler==3.11.3",
    "beautifulsoup4==4.15.0",
    "Flask==3.1.3",
    "gspread==6.2.1",
    "gunicorn==26.2.0",
    "openai==3.35.1",
    "requests==2.34.2",
    "twilio==9.12.0",
]

[tool.uv]
package = false
default-groups = ["dev", "legacy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
